<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070c1b" />
      <stop offset="55%" stop-color="#0a1022" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="neonWave" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="48%" stop-color="#a855f7" />
      <stop offset="78%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Subtle Ambient Halo Behind Center House -->
  <circle cx="32" cy="28" r="18" fill="#a855f7" fill-opacity="0.14" />
  <circle cx="16" cy="34" r="11" fill="#00f5d4" fill-opacity="0.12" />
  <circle cx="48" cy="34" r="11" fill="#ff007f" fill-opacity="0.12" />

  <!-- House Silhouettes (3 Houses Side-by-Side) -->
  <!-- Left Neighbor House #1 -->
  <path d="M6 37 L14.5 26.5 L23 37 V47 H6 Z" fill="#0b1328" stroke="#1e293b" stroke-width="1.2" />
  <!-- Center My House #2 (Taller & Prominent) -->
  <path d="M21 35 L32 20.5 L43 35 V47 H21 Z" fill="#101b37" stroke="#334155" stroke-width="1.3" />
  <!-- Right Neighbor House #3 -->
  <path d="M41 37 L49.5 26.5 L58 37 V47 H41 Z" fill="#0b1328" stroke="#1e293b" stroke-width="1.2" />

  <!-- Glowing 3-House Pitched Roofline LED Strip -->
  <path
    d="M5.5 37 L14.5 26 L22 35.2 L32 20 L42 35.2 L49.5 26 L58.5 37"
    stroke="url(#neonWave)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Bridging Street Synchronization Wave Below Rooflines -->
  <path
    d="M6 52 C 16 47.5, 24 56.5, 32 51.5 C 40 46.5, 48 55.5, 58 50.5"
    stroke="url(#neonWave)"
    stroke-width="2.4"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- Glowing Apex LED Nodes -->
  <circle cx="14.5" cy="26" r="2.3" fill="#00f5d4" />
  <circle cx="32" cy="20" r="2.7" fill="#a855f7" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="49.5" cy="26" r="2.3" fill="#fbbf24" />
</svg>
